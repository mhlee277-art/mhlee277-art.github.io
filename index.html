<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 학식 투표</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf4ff;color:#18345a;font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;line-height:1.6}header{background:linear-gradient(125deg,#123b80,#2675d9);color:white;padding:42px 20px 70px;text-align:center}header .tag{font-size:13px;font-weight:700;letter-spacing:2px;color:#d4e7ff}h1{font-size:clamp(28px,6vw,42px);margin:8px 0 4px;letter-spacing:-1.5px}header p{margin:0;color:#e2edff}main{max-width:820px;margin:-32px auto 0;padding:0 16px 30px;position:relative}.panel{background:white;border:1px solid #dce7f7;border-radius:22px;padding:clamp(18px,4vw,30px);margin-bottom:18px;box-shadow:0 8px 30px #143b8010}h2{margin:0 0 5px;font-size:23px;letter-spacing:-.7px}.hint{color:#526888;font-size:14px;margin:0 0 20px}.menus{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px} .choice{position:relative;display:block;cursor:pointer}.choice input{position:absolute;opacity:0;top:14px;left:14px}.tile{display:flex;align-items:center;flex-direction:column;justify-content:center;text-align:center;gap:5px;border:2px solid #dbe7f7;border-radius:16px;padding:20px 8px;background:#f8fbff;min-height:150px;transition:background .2s,border-color .2s}.choice input:checked+.tile{background:#e6f0ff;border-color:#2166c5;box-shadow:0 0 0 1px #2166c5}.choice input:focus-visible+.tile{outline:3px solid #132f62;outline-offset:3px}.emoji{font-size:42px;line-height:1.3}.name{font-size:18px;font-weight:800}.desc{font-size:13px;color:#526888}.vote{width:100%;margin-top:20px;border:0;border-radius:12px;padding:15px;background:#1d62c5;color:white;font:inherit;font-size:18px;font-weight:800;cursor:pointer}.vote:hover:not(:disabled){background:#164fa0}.vote:disabled{background:#7892b6;cursor:not-allowed}button:focus-visible{outline:3px solid #163c78;outline-offset:3px}.message{min-height:24px;margin:10px 0 0;text-align:center;color:#1555aa;font-weight:700;font-size:14px}.result-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.total{font-size:14px;background:#eaf2ff;border-radius:30px;padding:5px 12px;font-weight:700;color:#184e9a}.bar-row{margin:18px 0}.bar-label{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px;font-size:15px;font-weight:700}.bar-label span:last-child{color:#315a8f;font-variant-numeric:tabular-nums;white-space:nowrap}.track{height:24px;background:#edf2f9;border-radius:7px;overflow:hidden}.fill{height:100%;width:0;border-radius:7px;background:#236acb;transition:width .45s ease}.bar-row:nth-child(2) .fill{background:#4388dd}.bar-row:nth-child(3) .fill{background:#6ca0e4}.summary{background:#f1f6ff;border-radius:12px;padding:12px 15px;font-size:14px;color:#345780;margin:18px 0 0}.foot{text-align:center;color:#546983;font-size:12px;margin:16px 0}.reset{background:none;border:1px solid #b6c9e3;border-radius:8px;padding:7px 12px;font:inherit;font-size:12px;color:#345780;cursor:pointer}.reset:hover{background:#eaf2ff}@media(max-width:520px){header{padding-top:28px;padding-bottom:60px}.menus{grid-template-columns:1fr;gap:9px}.tile{flex-direction:row;justify-content:flex-start;text-align:left;min-height:82px;padding:12px 15px;gap:15px}.emoji{font-size:36px}.details{display:flex;flex-direction:column}.panel{border-radius:17px}.bar-label{font-size:14px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="tag">CAMPUS LUNCH VOTE</div><h1>오늘 뭐 먹을까?</h1><p id="date"></p><p>먹고 싶은 학식 메뉴에 한 표를 주세요!</p></header>
<main>
<section class="panel" aria-labelledby="vote-title"><h2 id="vote-title">오늘의 메뉴</h2><p class="hint">가장 먹고 싶은 메뉴 하나를 선택하세요.</p>
<form id="vote-form"><div class="menus" id="menus"></div><button type="submit" class="vote" id="vote-button" disabled>투표하기</button></form><p class="message" id="message" role="status" aria-live="polite"></p></section>
<section class="panel" aria-labelledby="result-title"><div class="result-head"><h2 id="result-title">실시간 투표 결과</h2><span class="total" id="total">총 0표</span></div><p class="hint">전체 투표에서 각 메뉴가 차지하는 비율입니다.</p><div id="bars" role="group" aria-label="메뉴별 득표 막대그래프"></div><p class="summary" id="summary" aria-live="polite">아직 투표가 없습니다.</p></section>
<div class="foot">이 페이지는 연습용입니다. 투표 결과는 현재 브라우저에만 저장됩니다.<br><button type="button" class="reset" id="reset">연습용 투표 초기화</button></div>
</main>
<script>
// 메뉴를 바꾸려면 아래 세 항목의 이름, 설명, 이모지를 수정하세요.
const menus = [
  {id:'pork', name:'제육덮밥', desc:'매콤한 제육볶음', emoji:'🍛'},
  {id:'cutlet', name:'돈가스', desc:'바삭한 등심 돈가스', emoji:'🍱'},
  {id:'noodle', name:'잔치국수', desc:'따뜻한 멸치 육수', emoji:'🍜'}
];
const now = new Date();
const day = [now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('-');
const key = 'campus-lunch-vote-v1:' + day;
const empty = () => Object.fromEntries(menus.map(m=>[m.id,0]));
let storageOK = true;
let counts = empty();
function read(){try{const raw=localStorage.getItem(key);const saved=raw?JSON.parse(raw):{};return Object.fromEntries(menus.map(m=>[m.id,Number.isSafeInteger(saved?.[m.id])&&saved[m.id]>=0?saved[m.id]:0]));}catch(e){storageOK=false;return counts;}}
function save(){try{localStorage.setItem(key,JSON.stringify(counts));}catch(e){storageOK=false;}}
counts=read();
const $ = id => document.getElementById(id);
$('date').textContent = new Intl.DateTimeFormat('ko-KR',{dateStyle:'full'}).format(now);
menus.forEach((m,i)=>{
  const label=document.createElement('label');label.className='choice';
  const radio=document.createElement('input');radio.type='radio';radio.name='menu';radio.value=m.id;radio.setAttribute('aria-label',m.name);
  const tile=document.createElement('span');tile.className='tile';
  const emoji=document.createElement('span');emoji.className='emoji';emoji.textContent=m.emoji;emoji.setAttribute('aria-hidden','true');
  const details=document.createElement('span');details.className='details';
  const name=document.createElement('span');name.className='name';name.textContent=m.name;
  const desc=document.createElement('span');desc.className='desc';desc.textContent=m.desc;
  details.append(name,document.createElement('br'),desc);tile.append(emoji,details);label.append(radio,tile);$('menus').append(label);
  const row=document.createElement('div');row.className='bar-row';
  const info=document.createElement('div');info.className='bar-label';
  const title=document.createElement('span');title.textContent=m.emoji+' '+m.name;
  const value=document.createElement('span');value.id='value-'+m.id;info.append(title,value);
  const track=document.createElement('div');track.className='track';track.setAttribute('aria-hidden','true');
  const fill=document.createElement('div');fill.className='fill';fill.id='fill-'+m.id;track.append(fill);row.append(info,track);$('bars').append(row);
});
function render(){
  const total=menus.reduce((s,m)=>s+counts[m.id],0);
  $('total').textContent='총 '+total+'표';
  menus.forEach(m=>{const pct=total?counts[m.id]/total*100:0;$('value-'+m.id).textContent=counts[m.id]+'표 · '+pct.toFixed(1).replace(/\.0$/,'')+'%';$('fill-'+m.id).style.width=pct+'%';});
  const max=Math.max(...Object.values(counts));const leaders=menus.filter(m=>counts[m.id]===max).map(m=>m.name);
  $('summary').textContent=total===0?'아직 투표가 없습니다. 첫 번째 표를 남겨 보세요!':leaders.length>1?'공동 1위: '+leaders.join(', ')+' ('+max+'표씩)':'현재 1위: '+leaders[0]+' ('+max+'표)';
}
$('vote-form').addEventListener('change',()=>{$('vote-button').disabled=false;$('message').textContent='';});
$('vote-form').addEventListener('submit',e=>{
  e.preventDefault();const selected=document.querySelector('input[name="menu"]:checked');if(!selected||!menus.some(m=>m.id===selected.value))return;
  if(storageOK)counts=read();counts[selected.value]++;save();render();
  $('message').textContent=menus.find(m=>m.id===selected.value).name+'에 투표했어요!'+(storageOK?'':' (저장 불가: 화면에만 반영)');
  e.target.reset();$('vote-button').disabled=true;
});
$('reset').addEventListener('click',()=>{if(!confirm('오늘의 투표 결과를 모두 초기화할까요?'))return;counts=empty();save();render();$('vote-form').reset();$('vote-button').disabled=true;$('message').textContent='투표 결과를 초기화했습니다.';});
window.addEventListener('storage',e=>{if(e.key===key||e.key===null){counts=read();render();}});
render();
</script>
</body>
</html>
